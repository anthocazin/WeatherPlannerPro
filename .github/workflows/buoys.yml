name: Buoy data (NOAA NDBC)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buoy-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the buoy feed
        run: python3 tools/buoys.py out
      - name: Publish on the buoy-data branch (single commit, no history)
        run: |
          cd out
          git init -q -b buoy-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Buoy data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buoy-data
